// ملف build.gradle الخاص بالموديول (app) — ضع/حدّث الحقل namespace هنا
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' // إن كنت تستخدم Kotlin
}

android {
    namespace 'com.example.yemenmusicplayer' // <-- ضع هنا الـ namespace الصحيح
    compileSdk 33

    defaultConfig {
        applicationId "com.example.yemenmusicplayer"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// لعرض تفاصيل التحذيرات حول APIs المهجورة أثناء التجميع:
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "com.google.android.exoplayer:exoplayer:2.18.7"
    implementation "com.google.android.exoplayer:exoplayer-core:2.18.7"
    implementation "com.google.android.exoplayer:exoplayer-dash:2.18.7"
    implementation "com.google.android.exoplayer:exoplayer-ui:2.18.7"
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}


